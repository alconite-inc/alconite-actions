name: Build and publish application

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  stack:
    permissions:
      contents: read
      packages: write
    uses: alconite-inc/alconite-actions/.github/workflows/stack-ci.yml@v2.5.0
    with:
      docker: "true"
      docker-push: ${{ github.event_name == 'push' }}
    # The default image is ghcr.io/<owner>/<repository>; github.token authenticates
    # publication. BuildKit attaches SBOM/provenance to the image in the registry.
    # GitHub artifact attestation and its token permissions are not required.
