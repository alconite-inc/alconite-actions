name: Alconite Docker CI
description: Standard Docker build/push using docker/metadata-action tags and GHA cache.

inputs:
  registry:
    description: "Container registry host (default ghcr.io)."
    required: false
    default: "ghcr.io"

  image:
    description: "Full image name WITHOUT tag. Empty => <registry>/<owner>/<repo>."
    required: false
    default: ""

  dockerfile:
    description: "Path to Dockerfile."
    required: false
    default: "Dockerfile"

  context:
    description: "Docker build context."
    required: false
    default: "."

  platforms:
    description: "Comma-separated target platforms; empty uses default runner arch."
    required: false
    default: ""

  push:
    description: "Push mode (auto|true|false). auto pushes on main or tags."
    required: false
    default: "auto"

  registry-username:
    description: "Registry username for login."
    required: false
    default: ${{ github.actor }}

  registry-password:
    description: "Registry password/token for login."
    required: true

  release-version:
    description: "Optional release version (X.Y.Z) to add as an extra docker tag."
    required: false
    default: ""

  tag-latest-on-main:
    description: "Whether to tag 'latest' on main (true|false)."
    required: false
    default: "false"

outputs:
  image:
    description: "Resolved docker image name without tag."
    value: ${{ steps.image.outputs.value }}
  tags:
    description: "Generated docker tag list from metadata-action."
    value: ${{ steps.meta.outputs.tags }}
  labels:
    description: "Generated docker labels from metadata-action."
    value: ${{ steps.meta.outputs.labels }}

runs:
  using: composite
  steps:
    - name: Resolve image name
      id: image
      shell: bash
      run: |
        set -euo pipefail
        if [[ -n "${{ inputs.image }}" ]]; then
          echo "value=${{ inputs.image }}" >> "$GITHUB_OUTPUT"
        else
          repo="${GITHUB_REPOSITORY,,}"
          echo "value=${{ inputs.registry }}/$repo" >> "$GITHUB_OUTPUT"
        fi

    - name: Decide push mode
      id: pushmode
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.push }}" == "auto" ]]; then
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "value=${{ inputs.push }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Docker meta (tags + labels)
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.image.outputs.value }}
        tags: |
          type=ref,event=branch
          type=ref,event=tag
          type=sha,format=short,prefix=sha-
          type=semver,pattern={{version}},prefix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}}.{{minor}},prefix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=semver,pattern={{major}},prefix=,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          type=raw,value=latest,enable=${{ inputs.tag-latest-on-main == 'true' && github.ref == 'refs/heads/main' }}
          type=raw,value=${{ inputs.release-version }},enable=${{ inputs.release-version != '' }}

    - name: Set up QEMU (multi-arch)
      if: ${{ inputs.platforms != '' }}
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to registry
      uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Build (and maybe push)
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        platforms: ${{ inputs.platforms }}
        push: ${{ steps.pushmode.outputs.value }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
