openapi: 3.1.0
info:
  title: Runtime Verify fixture
  version: 1.0.0
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Healthy
          headers:
            X-Request-Id:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /customers/{customerId}:
    get:
      operationId: getCustomer
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
        - name: includeHistory
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: string
        '404':
          description: Problem Details
          content:
            application/problem+json:
              schema:
                type: object
                required: [type, title, status]
                properties:
                  type:
                    type: string
                  title:
                    type: string
                  status:
                    type: integer
components:
  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
