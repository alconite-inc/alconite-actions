name: Alconite Node CI
description: Reproducible Node 24 CI for locked npm, pnpm, and Yarn projects.

inputs:
  node-version:
    description: Supported Node.js version to install.
    required: false
    default: "24"
  package-manager:
    description: Package manager selection (auto, npm, pnpm, or yarn).
    required: false
    default: auto
  working-directory:
    description: Project directory relative to the workspace.
    required: false
    default: .
  pnpm-version:
    description: Optional pnpm version. Otherwise package.json must pin packageManager.
    required: false
    default: ""
  yarn-version:
    description: Optional Yarn version. Otherwise package.json must pin packageManager.
    required: false
    default: ""
  script:
    description: Package script name to run after installation. Empty skips execution.
    required: false
    default: test
  cache-dependency-path:
    description: Optional lockfile path used for dependency caching.
    required: false
    default: ""
  registry-url:
    description: Package registry URL used by setup-node.
    required: false
    default: https://npm.pkg.github.com
  registry-scope:
    description: Optional package registry scope, such as @alconite-inc.
    required: false
    default: ""
  packages-token:
    description: Optional token for private package installation.
    required: false
    default: ""
  upload-reports:
    description: Upload JUnit XML reports (true or false).
    required: false
    default: "true"
  junit-files:
    description: Paths or globs for JUnit XML reports.
    required: false
    default: "**/junit*.xml"
  artifact-name:
    description: Name of the uploaded test report artifact.
    required: false
    default: node-test-reports

outputs:
  package-manager:
    description: Detected package manager.
    value: ${{ steps.detect.outputs.manager }}

runs:
  using: composite
  steps:
    - name: Validate inputs and detect package manager
      id: detect
      shell: bash
      env:
        REQUESTED_MANAGER: ${{ inputs.package-manager }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        CACHE_DEPENDENCY_PATH: ${{ inputs.cache-dependency-path }}
        PNPM_VERSION: ${{ inputs.pnpm-version }}
        YARN_VERSION: ${{ inputs.yarn-version }}
        SCRIPT_NAME: ${{ inputs.script }}
        UPLOAD_REPORTS: ${{ inputs.upload-reports }}
      run: |
        set -euo pipefail
        case "$UPLOAD_REPORTS" in true|false) ;; *) echo "::error::upload-reports must be true or false"; exit 1 ;; esac
        if [[ ! -d "$WORKING_DIRECTORY" || ! -f "$WORKING_DIRECTORY/package.json" ]]; then
          echo "::error::working-directory must contain package.json"
          exit 1
        fi
        if [[ -n "$SCRIPT_NAME" && ! "$SCRIPT_NAME" =~ ^[A-Za-z0-9_.:@/-]+$ ]]; then
          echo "::error::script must be a package script name, not a shell command"
          exit 1
        fi

        package_manager_field="$(node -e "const path=require('node:path'); const p=require(path.resolve(process.argv[1], 'package.json')); process.stdout.write(typeof p.packageManager === 'string' ? p.packageManager : '')" "$WORKING_DIRECTORY")"
        if [[ "$package_manager_field" == *$'\n'* || "$package_manager_field" == *$'\r'* ]]; then
          echo "::error::packageManager must be a single line"
          exit 1
        fi
        manager="$REQUESTED_MANAGER"
        if [[ "$manager" == "auto" ]]; then
          if [[ -f "$WORKING_DIRECTORY/pnpm-lock.yaml" || "$package_manager_field" == pnpm@* ]]; then manager=pnpm
          elif [[ -f "$WORKING_DIRECTORY/yarn.lock" || "$package_manager_field" == yarn@* ]]; then manager=yarn
          else manager=npm
          fi
        fi
        case "$manager" in npm|pnpm|yarn) ;; *) echo "::error::package-manager must be auto, npm, pnpm, or yarn"; exit 1 ;; esac

        case "$manager" in
          npm) lockfile="$WORKING_DIRECTORY/package-lock.json"; [[ -f "$lockfile" ]] || lockfile="$WORKING_DIRECTORY/npm-shrinkwrap.json" ;;
          pnpm) lockfile="$WORKING_DIRECTORY/pnpm-lock.yaml" ;;
          yarn) lockfile="$WORKING_DIRECTORY/yarn.lock" ;;
        esac
        if [[ ! -f "$lockfile" ]]; then echo "::error::A committed lockfile is required for $manager"; exit 1; fi
        if [[ -n "$CACHE_DEPENDENCY_PATH" ]]; then lockfile="$CACHE_DEPENDENCY_PATH"; fi
        if [[ "$manager" == "pnpm" && -z "$PNPM_VERSION" && "$package_manager_field" != pnpm@* ]]; then
          echo "::error::Pin pnpm in package.json packageManager or provide pnpm-version"
          exit 1
        fi
        if [[ "$manager" == "yarn" && -z "$YARN_VERSION" && "$package_manager_field" != yarn@* ]]; then
          echo "::error::Pin Yarn in package.json packageManager or provide yarn-version"
          exit 1
        fi
        yarn_spec=""
        if [[ "$manager" == "yarn" ]]; then
          if [[ -n "$YARN_VERSION" ]]; then yarn_spec="yarn@$YARN_VERSION"; else yarn_spec="$package_manager_field"; fi
          [[ "$yarn_spec" != *$'\n'* && "$yarn_spec" != *$'\r'* ]] || { echo "::error::Invalid Yarn version"; exit 1; }
        fi
        {
          printf 'manager=%s\nlockfile=%s\npnpm-from-package=%s\n' \
            "$manager" "$lockfile" "$([[ "$package_manager_field" == pnpm@* ]] && echo true || echo false)"
          printf 'yarn-spec=%s\n' "$yarn_spec"
        } >> "$GITHUB_OUTPUT"

    - name: Set up explicit pnpm
      if: ${{ steps.detect.outputs.manager == 'pnpm' && inputs.pnpm-version != '' }}
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: ${{ inputs.pnpm-version }}
        run_install: false

    - name: Set up package.json pnpm
      if: ${{ steps.detect.outputs.manager == 'pnpm' && inputs.pnpm-version == '' }}
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        run_install: false

    - name: Enable Corepack for Yarn
      if: ${{ steps.detect.outputs.manager == 'yarn' }}
      shell: bash
      env:
        YARN_SPEC: ${{ steps.detect.outputs.yarn-spec }}
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare "$YARN_SPEC" --activate

    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ steps.detect.outputs.manager }}
        cache-dependency-path: ${{ steps.detect.outputs.lockfile }}
        package-manager-cache: false
        registry-url: ${{ inputs.registry-url }}
        scope: ${{ inputs.registry-scope }}

    - name: Install npm dependencies
      if: ${{ steps.detect.outputs.manager == 'npm' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: npm ci

    - name: Install pnpm dependencies
      if: ${{ steps.detect.outputs.manager == 'pnpm' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: pnpm install --frozen-lockfile

    - name: Install Yarn dependencies
      if: ${{ steps.detect.outputs.manager == 'yarn' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: |
        set -euo pipefail
        major="$(yarn --version | cut -d. -f1)"
        if (( major >= 2 )); then yarn install --immutable
        else yarn install --frozen-lockfile
        fi

    - name: Run npm script
      if: ${{ steps.detect.outputs.manager == 'npm' && inputs.script != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPT_NAME: ${{ inputs.script }}
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: npm run "$SCRIPT_NAME"

    - name: Run pnpm script
      if: ${{ steps.detect.outputs.manager == 'pnpm' && inputs.script != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPT_NAME: ${{ inputs.script }}
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: pnpm run "$SCRIPT_NAME"

    - name: Run Yarn script
      if: ${{ steps.detect.outputs.manager == 'yarn' && inputs.script != '' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SCRIPT_NAME: ${{ inputs.script }}
        NODE_AUTH_TOKEN: ${{ inputs.packages-token }}
      run: yarn run "$SCRIPT_NAME"

    - name: Upload Node test reports
      if: ${{ inputs.upload-reports == 'true' && always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.junit-files }}
        if-no-files-found: ignore
        retention-days: 14
