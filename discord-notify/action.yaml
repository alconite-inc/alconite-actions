name: Alconite Discord Notification
description: Send a bounded Discord workflow notification without a third-party action dependency.

inputs:
  webhook-url:
    description: Discord webhook URL.
    required: true
  release-version:
    description: Optional release version.
    required: false
    default: ""
  job-status:
    description: Workflow status (success, failure, or cancelled).
    required: true

runs:
  using: composite
  steps:
    - name: Send Discord notification
      shell: bash
      env:
        DISCORD_WEBHOOK_URL: ${{ inputs.webhook-url }}
        JOB_STATUS: ${{ inputs.job-status }}
        RELEASE_VERSION: ${{ inputs.release-version }}
      run: node "$GITHUB_ACTION_PATH/notify.mjs"
