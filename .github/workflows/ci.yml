name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source and metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install locked development dependencies
        run: npm ci
      - name: Audit npm dependencies
        run: npm audit --audit-level=high
      - name: Verify source, tests, actions, dependencies, and distributions
        run: npm run verify
      - name: Verify checked-in JavaScript builds
        shell: bash
        run: |
          if ! git diff --quiet -- dist runtime-verify/dist impact/dist; then
            echo "::error::A checked-in distribution is stale. Run 'npm run build' with the locked dependencies and commit the generated files."
            git diff --name-only -- dist runtime-verify/dist impact/dist
            exit 1
          fi
      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Lint workflows and embedded shell
        run: actionlint -color

  sentinel-image:
    name: Sentinel image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Test portable runner source
        run: |
          npm ci
          npm test
          npm run validate:sentinel-container
      - name: Build reviewed linux/amd64 image
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          docker buildx build --load --platform linux/amd64 \
            --file sentinel-executor/Dockerfile \
            --tag alconite/sentinel-executor:2.4.1-ci \
            --build-arg IMAGE_VERSION=2.4.1 \
            --build-arg IMAGE_REVISION="$IMAGE_REVISION" \
            --build-arg IMAGE_CREATED="$(git show -s --format=%cI HEAD)" .
      - name: Test hardened image
        run: node scripts/test-sentinel-container.mjs alconite/sentinel-executor:2.4.1-ci
      - name: Generate SPDX JSON SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: alconite/sentinel-executor:2.4.1-ci
          format: spdx-json
          output-file: sentinel-executor.spdx.json
          upload-artifact: false
      - name: Scan operating-system and language packages
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: alconite/sentinel-executor:2.4.1-ci
          fail-build: true
          severity-cutoff: high

  java-action:
    name: Java action fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./java-ci
        with:
          build-tool: maven
          working-directory: test/fixtures/java
          upload-reports: "false"

  node-action:
    name: Node action fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./node-ci
        with:
          working-directory: test/fixtures/node
          upload-reports: "false"

  rust-action:
    name: Rust action fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./rust-ci
        with:
          working-directory: test/fixtures/rust

  docker-action:
    name: Docker action fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./docker-ci
        with:
          context: test/fixtures/docker
          dockerfile: test/fixtures/docker/Dockerfile
          push: "false"
          load: "false"
