name: Release

on:
  push:
    tags:
      - v2.*.*

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable tag target and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "$GITHUB_SHA" != "$tag_commit" ]]; then
            echo "::error::Workflow commit $GITHUB_SHA does not match tag target $tag_commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "::error::Tag target $tag_commit is not reachable from origin/main at $main_commit"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: Require reproducible checked-in build
        run: git diff --exit-code -- dist runtime-verify/dist impact/dist sentinel-executor/dist
      - name: Generate version and SHA usage references
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/generate-release-pins.mjs
      - name: Attest Contract Guard JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/**
      - name: Attest Runtime Verify JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime-verify/dist/**
      - name: Attest Impact JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: impact/dist/**
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build reviewed linux/amd64 Sentinel image
        shell: bash
        env:
          IMAGE_REVISION: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          docker buildx build --load --platform linux/amd64 \
            --file sentinel-executor/Dockerfile \
            --tag "alconite/sentinel-executor:${RELEASE_TAG}-tested" \
            --build-arg IMAGE_VERSION="$version" \
            --build-arg IMAGE_REVISION="$IMAGE_REVISION" \
            --build-arg IMAGE_CREATED="$(git show -s --format=%cI HEAD)" .
      - name: Test hardened Sentinel image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/test-sentinel-container.mjs "alconite/sentinel-executor:${RELEASE_TAG}-tested"
      - name: Generate Sentinel SPDX JSON SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: alconite/sentinel-executor:${{ github.ref_name }}-tested
          format: spdx-json
          output-file: sentinel-executor.spdx.json
          upload-artifact: false
      - name: Scan Sentinel operating-system and language packages
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          image: alconite/sentinel-executor:${{ github.ref_name }}-tested
          fail-build: true
          severity-cutoff: high
      - name: Log in to GHCR after all local gates
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push tested image and same-digest aliases
        id: sentinel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image="ghcr.io/alconite-inc/sentinel-executor"
          version="${RELEASE_TAG#v}"
          minor="${version%.*}"
          major="${version%%.*}"
          set +e
          inspection_output="$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' 2>&1)"
          inspection_status=$?
          set -e
          inspection_state="$(printf '%s' "$inspection_output" | node scripts/validate-sentinel-container.mjs registry-inspection-state "$inspection_status")"
          case "$inspection_state" in
            present)
              echo "::error::Immutable GHCR exact version already exists; refusing to rewrite it"
              exit 1
              ;;
            absent) ;;
            *)
              echo "::error::Unable to prove the immutable GHCR exact version is absent"
              exit 1
              ;;
          esac
          docker tag "alconite/sentinel-executor:${RELEASE_TAG}-tested" "$image:$RELEASE_TAG"
          docker push "$image:$RELEASE_TAG"
          digest="$(docker buildx imagetools inspect "$image:$RELEASE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::Published Sentinel digest is invalid"; exit 1; }
          for alias in "$version" "$minor" "$major" latest; do
            docker buildx imagetools create --prefer-index=false --tag "$image:$alias" "$image@$digest"
            actual="$(docker buildx imagetools inspect "$image:$alias" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            [[ "$actual" == "$digest" ]] || { echo "::error::Alias $alias did not resolve to $digest"; exit 1; }
          done
          printf 'subject-name=%s\nsubject-digest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"
      - name: Generate Sentinel build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.sentinel.outputs.subject-name }}
          subject-digest: ${{ steps.sentinel.outputs.subject-digest }}
          push-to-registry: true
      - name: Generate Sentinel SBOM attestation
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.sentinel.outputs.subject-name }}
          subject-digest: ${{ steps.sentinel.outputs.subject-digest }}
          sbom-path: sentinel-executor.spdx.json
          push-to-registry: true
      - name: Summarize published Sentinel image
        shell: bash
        env:
          SUBJECT_NAME: ${{ steps.sentinel.outputs.subject-name }}
          SUBJECT_DIGEST: ${{ steps.sentinel.outputs.subject-digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          printf "## Sentinel executor image\n\n\`%s@%s\`\n\nTags: \`%s\`, \`%s\`, \`%s\`, \`%s\`, \`latest\`\n" \
            "$SUBJECT_NAME" "$SUBJECT_DIGEST" "$RELEASE_TAG" "$version" "${version%.*}" "${version%%.*}" >> "$GITHUB_STEP_SUMMARY"
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          SENTINEL_NAME: ${{ steps.sentinel.outputs.subject-name }}
          SENTINEL_DIGEST: ${{ steps.sentinel.outputs.subject-digest }}
        run: |
          set -euo pipefail
          node scripts/generate-release-notes.mjs
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG" \
            --notes-file build/release/release-notes.md \
            build/release/release-pins.md build/release/release-pins.json \
            build/release/release-notes.md sentinel-executor.spdx.json
