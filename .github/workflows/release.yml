name: Release

on:
  push:
    tags:
      - v2.*.*

permissions:
  contents: read

jobs:
  release:
    name: Verify and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable tag target and main ancestry
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin +refs/heads/main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          main_commit="$(git rev-parse "refs/remotes/origin/main^{commit}")"
          if [[ "$GITHUB_SHA" != "$tag_commit" ]]; then
            echo "::error::Workflow commit $GITHUB_SHA does not match tag target $tag_commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tag_commit" "$main_commit"; then
            echo "::error::Tag target $tag_commit is not reachable from origin/main at $main_commit"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          package-manager-cache: false
      - name: Validate release version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "v$package_version" ]]; then
            echo "::error::Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi
      - run: npm ci
      - run: npm run verify
      - name: Require reproducible checked-in build
        run: git diff --exit-code -- dist runtime-verify/dist impact/dist
      - name: Attest Contract Guard JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/**
      - name: Attest Runtime Verify JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: runtime-verify/dist/**
      - name: Attest Impact JavaScript build
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: impact/dist/**
      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
