name: Alconite Gradle Maven Publish - GitHub Registry
description: Builds and publishes a Gradle project to GitHub Packages Maven Registry.

inputs:
  gradle-task:
    description: "Gradle task(s) to run for publishing"
    required: false
    default: "publish"
  upload-artifact:
    description: "Upload built jars as an artifact (true|false)"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Gather Release Version
      shell: bash
      run: |
        set -euo pipefail
        # expects tags like v1.2.3
        echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

    - name: Verify GitHub Packages credentials exist
      shell: bash
      run: |
        test -f "$HOME/.gradle/gradle.properties"
        grep -q '^gpr\.key=' "$HOME/.gradle/gradle.properties"

    - name: Publish to GitHub Packages Maven Registry
      shell: bash
      run: |
        set -euo pipefail
        ./gradlew ${{ inputs.gradle-task }} -PreleaseVersion="$RELEASE_VERSION" --no-daemon --stacktrace

    - name: Upload Created Artifact
      if: ${{ inputs.upload-artifact == 'true' }}
      uses: actions/upload-artifact@v6
      with:
        name: built-artifact
        path: |
          **/build/libs/*.jar
        if-no-files-found: error
