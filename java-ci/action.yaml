name: Alconite Java CI
description: Standard Java CI (Gradle or Maven) with GitHub Packages auth, wrapper policy, reporting, and test artifacts.

inputs:
  java-version:
    description: "Java version to install."
    required: false
    default: "25"

  build-tool:
    description: "Build tool selection (auto|gradle|maven)."
    required: false
    default: "auto"

  packages-token:
    description: "Token/PAT for reading GitHub Packages Maven registry. Leave empty if not needed."
    required: false
    default: ""

  reporting-token:
    description: "Token for PR comments/checks (usually github.token)."
    required: false
    default: ${{ github.token }}

  reporting:
    description: "Enable reporting (coverage comment, junit publish, artifacts) (true|false)."
    required: false
    default: "true"

  skip-tests:
    description: "Skip tests during CI build (true|false)."
    required: false
    default: "false"

  gradle-tasks:
    description: "Gradle tasks to run (e.g. 'test' or 'test jacocoTestReport')."
    required: false
    default: "test"

  maven-goals:
    description: "Maven goals/phases to run (e.g. 'verify')."
    required: false
    default: "verify"

  maven-server-id:
    description: "Maven server id used in ~/.m2/settings.xml for GitHub Packages credentials."
    required: false
    default: "alconite-gpr"

  jacoco-paths-gradle:
    description: "Glob(s) to JaCoCo XML report(s) for Gradle."
    required: false
    default: "${{ github.workspace }}/**/build/reports/jacoco/test/jacocoTestReport.xml"

  jacoco-paths-maven:
    description: "Glob(s) to JaCoCo XML report(s) for Maven."
    required: false
    default: "${{ github.workspace }}/**/target/site/jacoco/jacoco.xml"

  junit-files-gradle:
    description: "Glob(s) to Gradle JUnit XML test result files."
    required: false
    default: "**/build/test-results/**/*.xml"

  junit-files-maven:
    description: "Glob(s) to Maven Surefire/Failsafe JUnit XML test result files."
    required: false
    default: |
      **/target/surefire-reports/*.xml
      **/target/failsafe-reports/*.xml

  min-coverage-overall:
    description: "Minimum overall coverage percentage for PR coverage comment."
    required: false
    default: "80"

  coverage-title:
    description: "Title for the PR coverage report/comment."
    required: false
    default: "Code Coverage Report"

  artifact-name:
    description: "Name of the uploaded artifact containing test/coverage reports."
    required: false
    default: "test-report"

  artifact-paths:
    description: "Paths/globs to upload as artifact for test/coverage reports."
    required: false
    default: |
      **/build/reports/tests/
      **/build/reports/jacoco/
      **/target/site/jacoco/
      **/target/surefire-reports/
      **/target/failsafe-reports/

outputs:
  build-tool:
    description: "Detected build tool (gradle|maven)."
    value: ${{ steps.detect.outputs.tool }}

runs:
  using: composite
  steps:
    - name: Detect build tool
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        tool="${{ inputs.build-tool }}"
        if [[ "$tool" == "gradle" || "$tool" == "maven" ]]; then
          echo "tool=$tool" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -f "./gradlew" || -f "build.gradle" || -f "build.gradle.kts" || -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
          echo "tool=gradle" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -f "./mvnw" || -f "pom.xml" ]]; then
          echo "tool=maven" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "::error::Unable to detect build tool. Provide inputs.build-tool=gradle|maven."
        exit 1

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: ${{ steps.detect.outputs.tool }}

    - name: Setup Gradle
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      uses: gradle/actions/setup-gradle@v5

    - name: Validate Gradle Wrapper
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      uses: gradle/actions/wrapper-validation@v5

    - name: Configure GitHub Packages for Gradle
      if: ${{ steps.detect.outputs.tool == 'gradle' && inputs.packages-token != '' }}
      shell: bash
      env:
        GPR_USER: ${{ github.actor }}
        GPR_KEY: ${{ inputs.packages-token }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.gradle"
        props="$HOME/.gradle/gradle.properties"
        touch "$props"
        grep -vE '^(gpr\.user|gpr\.key)=' "$props" > "${props}.tmp" || true
        mv "${props}.tmp" "$props"
        {
          echo "gpr.user=$GPR_USER"
          echo "gpr.key=$GPR_KEY"
        } >> "$props"

    - name: Enforce Maven Wrapper
      if: ${{ steps.detect.outputs.tool == 'maven' }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ ! -f "./mvnw" ]]; then
          echo "::error::Maven wrapper (./mvnw) is required by company policy."
          exit 1
        fi
        chmod +x ./mvnw

    - name: Configure GitHub Packages for Maven
      if: ${{ steps.detect.outputs.tool == 'maven' && inputs.packages-token != '' }}
      shell: bash
      env:
        GPR_USER: ${{ github.actor }}
        GPR_KEY: ${{ inputs.packages-token }}
        SERVER_ID: ${{ inputs.maven-server-id }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.m2"
        cat > "$HOME/.m2/settings.xml" <<EOF
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                  xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
          <servers>
            <server>
              <id>${SERVER_ID}</id>
              <username>${GPR_USER}</username>
              <password>${GPR_KEY}</password>
            </server>
          </servers>
        </settings>
        EOF

    - name: Gradle build & test
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      shell: bash
      run: |
        set -euo pipefail
        chmod +x ./gradlew
        args=(--no-daemon --stacktrace)
        if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
          args+=(-x test)
        fi
        # shellcheck disable=SC2206
        tasks=(${{ inputs.gradle-tasks }})
        ./gradlew "${tasks[@]}" "${args[@]}"

    - name: Maven build & test
      if: ${{ steps.detect.outputs.tool == 'maven' }}
      shell: bash
      run: |
        set -euo pipefail
        args=(-B -ntp -Dstyle.color=always)
        if [[ "${{ inputs.skip-tests }}" == "true" ]]; then
          args+=(-DskipTests)
        fi
        # shellcheck disable=SC2206
        goals=(${{ inputs.maven-goals }})
        ./mvnw "${args[@]}" "${goals[@]}"

    - name: Add Coverage To Pull Request (Gradle)
      if: ${{ inputs.reporting == 'true' && steps.detect.outputs.tool == 'gradle' && github.event_name == 'pull_request' }}
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ inputs.jacoco-paths-gradle }}
        token: ${{ inputs.reporting-token }}
        min-coverage-overall: ${{ inputs.min-coverage-overall }}
        title: ${{ inputs.coverage-title }}
        update-comment: true

    - name: Add Coverage To Pull Request (Maven)
      if: ${{ inputs.reporting == 'true' && steps.detect.outputs.tool == 'maven' && github.event_name == 'pull_request' }}
      uses: madrapps/jacoco-report@v1.7.2
      with:
        paths: ${{ inputs.jacoco-paths-maven }}
        token: ${{ inputs.reporting-token }}
        min-coverage-overall: ${{ inputs.min-coverage-overall }}
        title: ${{ inputs.coverage-title }}
        update-comment: true

    - name: Publish Test Results (Gradle)
      if: ${{ inputs.reporting == 'true' && steps.detect.outputs.tool == 'gradle' && always() }}
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ${{ inputs.junit-files-gradle }}
        github_token: ${{ inputs.reporting-token }}

    - name: Publish Test Results (Maven)
      if: ${{ inputs.reporting == 'true' && steps.detect.outputs.tool == 'maven' && always() }}
      uses: EnricoMi/publish-unit-test-result-action@v2
      with:
        files: ${{ inputs.junit-files-maven }}
        github_token: ${{ inputs.reporting-token }}

    - name: Upload Test Report
      if: ${{ inputs.reporting == 'true' && always() }}
      uses: actions/upload-artifact@v6
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-paths }}
        if-no-files-found: ignore
