name: Alconite Java CI
description: Reproducible Gradle or Maven CI with wrapper enforcement, safe package authentication, caching, and report artifacts.

inputs:
  java-version:
    description: Java version to install.
    required: false
    default: "25"
  build-tool:
    description: Build tool selection (auto, gradle, or maven).
    required: false
    default: auto
  working-directory:
    description: Project directory relative to the workspace.
    required: false
    default: .
  packages-user:
    description: GitHub Packages username. Defaults to github.actor.
    required: false
    default: ""
  packages-token:
    description: Optional token for reading private GitHub Packages dependencies.
    required: false
    default: ""
  maven-server-id:
    description: Maven server id referenced by the project distribution configuration.
    required: false
    default: alconite-gpr
  skip-tests:
    description: Skip test execution (true or false).
    required: false
    default: "false"
  gradle-tasks:
    description: Space-separated Gradle tasks. Values are passed as arguments, not shell source.
    required: false
    default: test
  maven-goals:
    description: Space-separated Maven goals. Values are passed as arguments, not shell source.
    required: false
    default: verify
  upload-reports:
    description: Upload test and coverage reports (true or false).
    required: false
    default: "true"
  artifact-name:
    description: Name of the report artifact.
    required: false
    default: java-test-reports
  artifact-paths:
    description: Paths or globs to upload for test and coverage reports.
    required: false
    default: |
      **/build/reports/tests/
      **/build/reports/jacoco/
      **/target/site/jacoco/
      **/target/surefire-reports/
      **/target/failsafe-reports/

outputs:
  build-tool:
    description: Detected build tool (gradle or maven).
    value: ${{ steps.detect.outputs.tool }}

runs:
  using: composite
  steps:
    - name: Validate inputs and detect build tool
      id: detect
      shell: bash
      env:
        REQUESTED_TOOL: ${{ inputs.build-tool }}
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        UPLOAD_REPORTS: ${{ inputs.upload-reports }}
      run: |
        set -euo pipefail
        case "$SKIP_TESTS" in true|false) ;; *) echo "::error::skip-tests must be true or false"; exit 1 ;; esac
        case "$UPLOAD_REPORTS" in true|false) ;; *) echo "::error::upload-reports must be true or false"; exit 1 ;; esac
        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "::error::working-directory does not exist"
          exit 1
        fi
        cd -- "$WORKING_DIRECTORY"
        tool="$REQUESTED_TOOL"
        if [[ "$tool" == "auto" ]]; then
          if [[ -f gradlew || -f build.gradle || -f build.gradle.kts || -f settings.gradle || -f settings.gradle.kts ]]; then
            tool=gradle
          elif [[ -f mvnw || -f pom.xml ]]; then
            tool=maven
          else
            echo "::error::Unable to detect Gradle or Maven in working-directory"
            exit 1
          fi
        fi
        case "$tool" in gradle|maven) ;; *) echo "::error::build-tool must be auto, gradle, or maven"; exit 1 ;; esac
        printf 'tool=%s\n' "$tool" >> "$GITHUB_OUTPUT"

    - name: Set up Java for Gradle
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Gradle
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      with:
        cache-provider: basic

    - name: Set up Java for Maven
      if: ${{ steps.detect.outputs.tool == 'maven' }}
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven
        server-id: ${{ inputs.maven-server-id }}
        server-username: ALCONITE_PACKAGES_USER
        server-password: ALCONITE_PACKAGES_TOKEN

    - name: Run Gradle CI
      if: ${{ steps.detect.outputs.tool == 'gradle' }}
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        GRADLE_TASKS: ${{ inputs.gradle-tasks }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        ORG_GRADLE_PROJECT_gprUser: ${{ inputs.packages-user || github.actor }}
        ORG_GRADLE_PROJECT_gprKey: ${{ inputs.packages-token }}
      run: |
        set -euo pipefail
        cd -- "$WORKING_DIRECTORY"
        if [[ ! -f gradlew ]]; then
          echo "::error::The Gradle wrapper (gradlew) is required"
          exit 1
        fi
        chmod +x gradlew
        read -r -a tasks <<< "$GRADLE_TASKS"
        if (( ${#tasks[@]} == 0 )); then echo "::error::gradle-tasks must not be empty"; exit 1; fi
        args=(--no-daemon --stacktrace)
        if [[ "$SKIP_TESTS" == "true" ]]; then args+=(-x test); fi
        ./gradlew "${tasks[@]}" "${args[@]}"

    - name: Run Maven CI
      if: ${{ steps.detect.outputs.tool == 'maven' }}
      shell: bash
      env:
        WORKING_DIRECTORY: ${{ inputs.working-directory }}
        MAVEN_GOALS: ${{ inputs.maven-goals }}
        SKIP_TESTS: ${{ inputs.skip-tests }}
        ALCONITE_PACKAGES_USER: ${{ inputs.packages-user || github.actor }}
        ALCONITE_PACKAGES_TOKEN: ${{ inputs.packages-token }}
      run: |
        set -euo pipefail
        cd -- "$WORKING_DIRECTORY"
        if [[ ! -f mvnw ]]; then
          echo "::error::The Maven wrapper (mvnw) is required"
          exit 1
        fi
        chmod +x mvnw
        read -r -a goals <<< "$MAVEN_GOALS"
        if (( ${#goals[@]} == 0 )); then echo "::error::maven-goals must not be empty"; exit 1; fi
        args=(-B -ntp -Dstyle.color=always)
        if [[ "$SKIP_TESTS" == "true" ]]; then args+=(-DskipTests); fi
        ./mvnw "${args[@]}" "${goals[@]}"

    - name: Upload Java reports
      if: ${{ inputs.upload-reports == 'true' && always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-paths }}
        if-no-files-found: ignore
        retention-days: 14
