name: Alconite Stack Orchestrator
description: Single entrypoint for CI + reporting + docker build/push + (optional) publish + Discord notify for java/node/docker repos.

inputs:
  stack:
    description: "Stack type to run (auto|java|node|docker). 'auto' detects based on repo files."
    required: false
    default: "auto"

  packages-token:
    description: "Token/PAT for reading private packages (GitHub Packages Maven/NPM). Leave empty if not needed."
    required: false
    default: ""

  reporting-token:
    description: "Token for PR comments/checks (usually github.token)."
    required: false
    default: ${{ github.token }}

  registry-password:
    description: "Password/token for container registry login (for GHCR typically github.token; requires packages:write in job permissions)."
    required: false
    default: ${{ github.token }}

  java-version:
    description: "Java version to install for Java builds."
    required: false
    default: "25"

  gradle-tasks:
    description: "Gradle task(s) to run for Java CI (e.g. 'test' or 'test jacocoTestReport')."
    required: false
    default: "test"

  maven-goals:
    description: "Maven goals/phases to run for Java CI (e.g. 'verify')."
    required: false
    default: "verify"

  skip-tests:
    description: "Skip tests during Java CI run (true|false)."
    required: false
    default: "false"

  maven-server-id:
    description: "Maven server id used in settings.xml for GitHub Packages credentials."
    required: false
    default: "alconite-gpr"

  node-version:
    description: "Node version to install for Node builds."
    required: false
    default: "20"

  node-package-manager:
    description: "Node package manager (auto|npm|pnpm|yarn)."
    required: false
    default: "auto"

  node-script:
    description: "Node script to run (e.g. 'test')."
    required: false
    default: "test"

  docker:
    description: "Whether to run docker build/push step (true|false)."
    required: false
    default: "true"

  push:
    description: "Docker push mode (auto|true|false). 'auto' pushes on main or tags."
    required: false
    default: "auto"

  registry:
    description: "Container registry host (default ghcr.io)."
    required: false
    default: "ghcr.io"

  image:
    description: "Full image name without tag. Empty => <registry>/<owner>/<repo>."
    required: false
    default: ""

  dockerfile:
    description: "Path to Dockerfile."
    required: false
    default: "Dockerfile"

  context:
    description: "Docker build context."
    required: false
    default: "."

  platforms:
    description: "Comma-separated target platforms for multi-arch builds (e.g. linux/amd64,linux/arm64). Empty => default runner arch."
    required: false
    default: ""

  tag-latest-on-main:
    description: "Whether to tag 'latest' on main branch (true|false)."
    required: false
    default: "false"

  publish:
    description: "Publish mode (auto|true|false). 'auto' publishes only on v* tags."
    required: false
    default: "auto"

  gradle-publish-task:
    description: "Gradle task(s) for publishing (default 'publish')."
    required: false
    default: "publish"

  maven-publish-goals:
    description: "Maven goals for publishing (default 'deploy')."
    required: false
    default: "deploy"

  upload-publish-artifact:
    description: "Upload built jars after publish (true|false)."
    required: false
    default: "true"

  reporting:
    description: "Enable reporting (JUnit publish, coverage comment, artifacts) (true|false)."
    required: false
    default: "true"

  min-coverage-overall:
    description: "Minimum overall coverage percentage for PR coverage comment."
    required: false
    default: "80"

  coverage-title:
    description: "Title used for coverage report/comment."
    required: false
    default: "Code Coverage Report"

  discord-webhook:
    description: "Discord webhook URL. If empty, no Discord notification is sent."
    required: false
    default: ""

  job-status:
    description: "Job status for Discord notification (success|failure|cancelled)."
    required: true
    default: ""

outputs:
  stack:
    description: "Resolved stack type used by orchestrator."
    value: ${{ steps.detect.outputs.stack }}
  release-version:
    description: "Parsed release version (X.Y.Z) when ref is a tag vX.Y.Z; empty otherwise."
    value: ${{ steps.release.outputs.version }}
  docker-image:
    description: "Resolved docker image name without tag (from docker-ci)."
    value: ${{ steps.docker.outputs.image }}
  docker-tags:
    description: "Computed docker tags (from docker/metadata-action)."
    value: ${{ steps.docker.outputs.tags }}

runs:
  using: composite
  steps:
    - name: Detect stack (auto)
      id: detect
      shell: bash
      run: |
        set -euo pipefail
        requested="${{ inputs.stack }}"
        if [[ "$requested" != "auto" ]]; then
          echo "stack=$requested" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -f "./gradlew" || -f "build.gradle" || -f "build.gradle.kts" || -f "settings.gradle" || -f "settings.gradle.kts" || -f "pom.xml" || -f "./mvnw" ]]; then
          echo "stack=java" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -f "package.json" ]]; then
          echo "stack=node" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "stack=docker" >> "$GITHUB_OUTPUT"

    - name: Determine release version from tag (vX.Y.Z)
      id: release
      shell: bash
      run: |
        set -euo pipefail
        version=""
        if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
          version="${GITHUB_REF_NAME#v}"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Decide publish mode (auto => v* tags only)
      id: publishmode
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${{ inputs.publish }}" == "auto" ]]; then
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi
        else
          echo "value=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
        fi

    - name: Java CI
      if: ${{ steps.detect.outputs.stack == 'java' }}
      uses: alconite-inc/alconite-actions/java-ci@v1
      with:
        java-version: ${{ inputs.java-version }}
        packages-token: ${{ inputs.packages-token }}
        reporting-token: ${{ inputs.reporting-token }}
        reporting: ${{ inputs.reporting }}
        gradle-tasks: ${{ inputs.gradle-tasks }}
        maven-goals: ${{ inputs.maven-goals }}
        skip-tests: ${{ inputs.skip-tests }}
        min-coverage-overall: ${{ inputs.min-coverage-overall }}
        coverage-title: ${{ inputs.coverage-title }}
        maven-server-id: ${{ inputs.maven-server-id }}

    - name: Node CI (minimal)
      if: ${{ steps.detect.outputs.stack == 'node' }}
      uses: alconite-inc/alconite-actions/node-ci@v1
      with:
        node-version: ${{ inputs.node-version }}
        packages-token: ${{ inputs.packages-token }}
        reporting-token: ${{ inputs.reporting-token }}
        reporting: ${{ inputs.reporting }}
        package-manager: ${{ inputs.node-package-manager }}
        script: ${{ inputs.node-script }}

    - name: Docker CI
      id: docker
      if: ${{ inputs.docker == 'true' && (steps.detect.outputs.stack == 'java' || steps.detect.outputs.stack == 'node' || steps.detect.outputs.stack == 'docker') }}
      uses: alconite-inc/alconite-actions/docker-ci@v1
      with:
        registry: ${{ inputs.registry }}
        image: ${{ inputs.image }}
        dockerfile: ${{ inputs.dockerfile }}
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        push: ${{ inputs.push }}
        registry-username: ${{ github.actor }}
        registry-password: ${{ inputs.registry-password }}
        tag-latest-on-main: ${{ inputs.tag-latest-on-main }}
        release-version: ${{ steps.release.outputs.version }}

    - name: Java Publish
      if: ${{ steps.publishmode.outputs.value == 'true' && steps.detect.outputs.stack == 'java' }}
      uses: alconite-inc/alconite-actions/java-publish@v1
      with:
        build-tool: auto
        gradle-task: ${{ inputs.gradle-publish-task }}
        maven-goals: ${{ inputs.maven-publish-goals }}
        upload-artifact: ${{ inputs.upload-publish-artifact }}

    - name: Send Discord notification
      uses: alconite-inc/alconite-actions/discord-notify@v1
      if: ${{ always() && inputs.discord-webhook != '' }}
      with:
        webhook-url: ${{ inputs.discord-webhook }}
        release-version: ${{ steps.release.outputs.version }}
        job-status: ${{ inputs.job-status }}
